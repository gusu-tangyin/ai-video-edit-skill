<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Avatar Studio</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #020817;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #cbd5e1;
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.16);
      --blue: #60a5fa;
      --blue-soft: rgba(59, 130, 246, 0.16);
      --warning: #fbbf24;
      --danger: #f87171;
      --shadow: rgba(0, 0, 0, 0.2);
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #020817, #0f172a 45%, #111827);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 20px 52px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.76);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 10px 30px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 1.38rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .meta-badge {
      background: var(--green-soft);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.42);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 25px var(--shadow);
    }

    h2 {
      margin: 0 0 18px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px 13px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(15, 23, 42, 0.9);
      color: white;
      outline: none;
    }

    input[type="file"]:focus, input[type="text"]:focus {
      border-color: rgba(96, 165, 250, 0.8);
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .checkbox-box {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      background: rgba(148, 163, 184, 0.06);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .checkbox-box input {
      accent-color: var(--green);
      width: 16px;
      height: 16px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .primary {
      flex: 1;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      padding: 14px 18px;
    }

    .secondary {
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #bfdbfe;
      padding: 14px 18px;
    }

    .preview-panel {
      display: grid;
      gap: 18px;
    }

    .video-box {
      width: 100%;
      min-height: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: #020617;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }

    .info-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .chip {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(148, 163, 184, 0.08);
    }

    .status {
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15, 118, 110, 0.12);
      border: 1px solid rgba(45, 212, 191, 0.25);
      color: #a7f3d0;
      font-size: 0.92rem;
      display: none;
    }

    .status.error {
      background: rgba(127, 29, 29, 0.18);
      border-color: rgba(248, 113, 113, 0.42);
      color: #fecaca;
    }

    .results-box {
      display: none;
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(148, 163, 184, 0.04);
      border-radius: 12px;
    }

    .results-box strong {
      display: block;
      margin-bottom: 10px;
      color: var(--text);
    }

    .step-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid rgba(34, 197, 94, 0.5);
      background: rgba(34, 197, 94, 0.12);
      color: #bbf7d0;
    }

    .meta-list {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 8px;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">AI Avatar Studio</div>
      <div class="meta-badge">face swap + avatar + lip sync</div>
    </header>

    <div class="layout">
      <div class="panel">
        <h2>Generate AI Avatar Video</h2>
        <form id="demoForm" enctype="multipart/form-data">
          <div class="field">
            <label for="input_video">Original video</label>
            <input type="file" id="input_video" name="input_video" accept="video/*" required />
          </div>

          <div class="field">
            <label for="source_face">Source face / avatar image</label>
            <input type="file" id="source_face" name="source_face" accept="image/*" required />
          </div>

          <div class="field">
            <label for="target_avatar">Target avatar image (optional)</label>
            <input type="file" id="target_avatar" name="target_avatar" accept="image/*" />
          </div>

          <div class="field">
            <label for="audio">Audio for lip sync (optional)</label>
            <input type="file" id="audio" name="audio" accept="audio/*" />
          </div>

          <div class="field">
            <label for="background">Virtual background (optional)</label>
            <input type="file" id="background" name="background" accept="image/*" />
          </div>

          <div class="field">
            <label>Workflow steps</label>
            <div class="step-grid">
              <label class="checkbox-box">
                <input type="checkbox" name="face_swap_enabled" checked />
                Face swap
              </label>
              <label class="checkbox-box">
                <input type="checkbox" name="avatar_replace_enabled" />
                Avatar replace
              </label>
              <label class="checkbox-box">
                <input type="checkbox" name="lip_sync_enabled" checked />
                Lip sync
              </label>
              <label class="checkbox-box">
                <input type="checkbox" name="background_replace_enabled" />
                Background replace
              </label>
            </div>
          </div>

          <div class="field">
            <label for="wav2lip_dir">Wav2Lip directory</label>
            <input type="text" id="wav2lip_dir" name="wav2lip_dir" value="./Wav2Lip" />
          </div>

          <div class="field">
            <label for="checkpoint_path">Checkpoint path</label>
            <input type="text" id="checkpoint_path" name="checkpoint_path" value="./checkpoints/wav2lip.pth" />
          </div>

          <div class="button-row">
            <button type="submit" class="primary">Generate</button>
            <button type="button" class="secondary" onclick="resetForm()">Reset</button>
          </div>
        </form>

        <div id="statusBox" class="status"></div>
      </div>

      <div class="panel preview-panel">
        <h2>Preview</h2>
        <div class="video-box">
          <video id="videoResult" controls muted playsinline></video>
        </div>

        <div class="info-grid">
          <div class="chip">Face swap</div>
          <div class="chip">Avatar replacement</div>
          <div class="chip">Lip sync</div>
          <div class="chip">Background replace</div>
        </div>

        <div id="resultsBox" class="results-box">
          <strong>Processing summary</strong>
          <div id="stepList" class="step-list"></div>
          <div id="metaList" class="meta-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('demoForm');
    const statusBox = document.getElementById('statusBox');
    const videoResult = document.getElementById('videoResult');
    const resultsBox = document.getElementById('resultsBox');
    const stepList = document.getElementById('stepList');
    const metaList = document.getElementById('metaList');

    function resetForm() {
      form.reset();
      statusBox.style.display = 'none';
      resultsBox.style.display = 'none';
      videoResult.removeAttribute('src');
      videoResult.load();
    }

    function renderSteps(steps) {
      stepList.innerHTML = '';
      if (!steps || !steps.length) {
        stepList.innerHTML = '<div class="step-badge">No steps selected</div>';
        return;
      }

      steps.forEach((step) => {
        const badge = document.createElement('div');
        badge.className = 'step-badge';
        badge.textContent = step;
        stepList.appendChild(badge);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      statusBox.style.display = 'block';
      statusBox.classList.remove('error');
      statusBox.textContent = 'Generating AI avatar video, please wait...';

      const formData = new FormData(form);
      formData.append('face_swap_enabled', formData.get('face_swap_enabled') ? 'true' : 'false');
      formData.append('avatar_replace_enabled', formData.get('avatar_replace_enabled') ? 'true' : 'false');
      formData.append('lip_sync_enabled', formData.get('lip_sync_enabled') ? 'true' : 'false');
      formData.append('background_replace_enabled', formData.get('background_replace_enabled') ? 'true' : 'false');

      try {
        const response = await fetch('/api/demo/ai_avatar', {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || 'Generation failed');
        }

        const resultPath = data.result_path || '';
        if (resultPath) {
          videoResult.src = resultPath;
          videoResult.load();
        }

        resultsBox.style.display = 'block';
        renderSteps(data.selected_steps || data.steps || []);

        metaList.innerHTML = '';
        const entries = [
          `status: ${data.status || 'success'}`,
          `steps: ${(data.selected_steps || data.steps || []).join(', ') || 'none'}`,
          `path: ${resultPath || 'n/a'}`
        ];

        entries.forEach((item) => {
          const row = document.createElement('div');
          row.textContent = item;
          metaList.appendChild(row);
        });

        statusBox.classList.remove('error');
        statusBox.textContent = 'Generation completed successfully.';
      } catch (err) {
        statusBox.classList.add('error');
        statusBox.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
